# Coturn configuration for local development
# Used by Dograh for WebRTC NAT traversal

# Listening port
listening-port=3478
tls-listening-port=5349

# Listen on all interfaces
listening-ip=0.0.0.0

# Relay IP range (for local development, use Docker network)
relay-ip=0.0.0.0
relay-ports=49152-49200

# Enable long-term credential mechanism
lt-cred-mech

# Default secret for TURN REST API (must match TURN_SECRET in docker-compose)
use-auth-secret
static-auth-secret=dograh-turn-secret

# Realm
realm=localhost

# Logging
log-file=stdout
verbose

# Security
no-multicast-peers
no-cli

# Allow local connections
no-loopback-peers
allow-loopback-peers
